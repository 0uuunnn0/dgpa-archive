name: 每日更新職缺資料

on:
  schedule:
    # UTC 17:00 = 台北時間隔日凌晨 01:00（你電腦有開機連網才會抓到）
    - cron: "0 17 * * *"
  workflow_dispatch: {}   # 允許在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

jobs:
  fetch:
    runs-on: self-hosted
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r scripts/requirements.txt

      - name: 執行診斷（顯示原始欄位，方便除錯，失敗不中斷）
        run: python inspect_feed.py || true
        working-directory: scripts

      - name: 抓取並更新資料
        run: python scripts/fetch_and_process.py
        working-directory: .

      - name: 提交更新
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "資料更新：${{ github.run_id }}"
          file_pattern: "data/history.json docs/data.json"
