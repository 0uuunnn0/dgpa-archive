<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公職ㄉ人力銀行｜職缺歷史檔案庫</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root{
  --cream:#FFF6E7;
  --card:#FFFFFF;
  --ink:#2B2118;
  --ink2:#5C5245;
  --muted:#8C8272;

  --tangerine:#FF7A45;
  --tangerine-dk:#E85F2A;
  --tangerine-tint:rgba(255,122,69,.16);
  --tangerine-tint2:rgba(255,122,69,.30);

  --amber:#FFB627;
  --amber-dk:#E39A0A;

  --cobalt:#3B5FE0;
  --cobalt-dk:#28459F;
  --cobalt-tint:rgba(59,95,224,.14);
  --cobalt-tint2:rgba(59,95,224,.28);

  --cherry:#F0473A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink2);
  font-family:'Noto Sans TC', sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:70px;
}
.mono{font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;}
.wrap{max-width:1020px; margin:0 auto; padding:0 20px;}
a{color:inherit;}
.round{font-family:'Baloo 2', 'Noto Sans TC', sans-serif;}

.stripe-band{
  height:56px; overflow:hidden; line-height:0;
}
.stripe-band svg{display:block; width:100%; height:100%;}
.wave-flow{animation:waveFlow 6s linear infinite;}
@keyframes waveFlow{
  from{ transform:translateX(0); }
  to{ transform:translateX(-200px); }
}

header{padding-top:24px;}
.header-card{
  position:relative; background:var(--tangerine); border:3px solid var(--ink); border-radius:26px;
  padding:24px 30px; overflow:hidden;
  box-shadow:6px 6px 0 var(--ink);
  display:flex; align-items:flex-start; gap:18px; flex-wrap:wrap;
}
.header-card::before{
  content:""; position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.35) 2.5px, transparent 2.5px);
  background-size:22px 22px; opacity:.5; pointer-events:none;
}
.hc-blob{position:absolute; border-radius:50%; z-index:0; border:3px solid var(--ink);}
.hc-blob.b1{width:150px; height:150px; background:var(--cobalt); top:-60px; right:-40px;}
.hc-blob.b2{width:60px; height:60px; background:var(--amber); bottom:-24px; right:120px; opacity:.9;}
.hc-blob.b3{width:46px; height:46px; background:var(--amber); top:58%; left:-22px;}
.header-text{position:relative; z-index:1; flex:1; min-width:220px; order:1;}
.header-text .eyebrow{
  font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:3px;
  color:rgba(255,255,255,.9); margin-bottom:6px; text-transform:uppercase; font-weight:700;
}
.header-text h1{
  font-family:'Baloo 2', 'Noto Sans TC', sans-serif;
  font-weight:800; font-size:52px; margin:0 0 10px; color:#fff; line-height:1.1;
  text-shadow:2.5px 2.5px 0 var(--ink2);
}
.header-text .desc{
  display:inline-block; background:var(--card); color:var(--ink); font-size:12.5px; font-weight:700;
  padding:8px 14px; border-radius:999px; border:2.5px solid var(--ink); margin:3px 6px 3px 0;
}

.highlight-section{margin:28px 0 26px;}
.highlight-title{
  display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;
  font-weight:800; font-size:16px; color:var(--ink); font-family:'Baloo 2', sans-serif;
}
.highlight-title .dot{width:12px;height:12px; background:var(--cherry); border-radius:50%; flex:none;}
.highlight-title .sub{font-size:12px; color:var(--muted); font-weight:500; font-family:'Noto Sans TC', sans-serif;}
.hl-legend{margin-left:auto; display:flex; gap:12px;}
.lg-item{display:flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--muted); font-family:'Noto Sans TC', sans-serif;}
.lg-sw{width:12px; height:12px; display:inline-block; border-radius:50%; border:2px solid var(--ink);}
.lg-sw.lg-簡任{background:var(--tangerine);}
.lg-sw.lg-薦任{background:var(--cobalt);}
.lg-sw.lg-委任{background:var(--amber);}
.highlight-row{display:grid; grid-template-columns:repeat(5,1fr); gap:12px;}
.hl-card{
  padding:16px 14px 14px; position:relative; cursor:pointer; border-radius:18px;
  border:2.5px solid var(--ink); box-shadow:4px 4px 0 var(--ink);
  display:flex; flex-direction:column; justify-content:space-between; min-height:130px;
  transition:transform .12s, box-shadow .12s;
}
.hl-card:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink);}
.hl-card.rank-簡任{background:var(--tangerine-tint2); color:var(--ink);}
.hl-card.rank-薦任{background:var(--cobalt-tint2); color:var(--ink);}
.hl-card.rank-委任{background:rgba(255,182,39,.32); color:var(--ink);}
.hl-card .hl-badge{
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:1px; font-weight:700;
  border:1.5px solid currentColor; border-radius:999px; padding:1px 8px; align-self:flex-start; margin-bottom:10px; opacity:.9;
}
.hl-card .hl-agency{font-weight:800; font-size:14.5px; line-height:1.35; font-family:'Baloo 2', sans-serif;}
.hl-card .hl-meta{font-size:10.5px; margin-top:10px; opacity:.8; line-height:1.6;}
@media (max-width:760px){
  .highlight-row{grid-template-columns:repeat(2,1fr);}
  .hl-card:nth-child(5){grid-column:span 2;}
}

.quick-search{margin-bottom:20px; position:relative;}
.quick-search input{
  width:100%; padding:16px 20px 16px 50px; font-size:16px; font-family:'Noto Sans TC', sans-serif; font-weight:500;
  border:3px solid var(--ink); background:var(--card); color:var(--ink); outline:none; border-radius:999px;
  box-shadow:4px 4px 0 var(--ink);
}
.quick-search input::placeholder{color:#B4A99A;}
.quick-search input:focus{border-color:var(--cobalt);}
.quick-search .icon{position:absolute; left:20px; top:50%; transform:translateY(-50%); font-size:17px; pointer-events:none;}

.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
.stat{background:var(--tangerine-tint); padding:14px 16px; border-radius:16px; border:2.5px solid var(--ink);}
.stat:nth-child(2){background:var(--cobalt-tint);}
.stat:nth-child(3){background:var(--cobalt-tint);}
.stat .num{font-family:'IBM Plex Mono', monospace; font-size:23px; font-weight:700; color:var(--ink);}
.stat .lbl{font-size:11.5px; color:var(--ink2); margin-top:3px; font-weight:600;}

.filter-panel{border:2.5px solid var(--ink); background:var(--card); padding:18px 22px 16px; margin-bottom:8px; border-radius:20px;}
.filter-panel .ftitle{font-weight:800; font-size:13.5px; color:var(--ink); margin-bottom:12px; display:flex; align-items:center; gap:8px; font-family:'Baloo 2', sans-serif;}
.filter-panel .ftitle .sq{width:10px;height:10px; background:var(--tangerine); border-radius:50%; display:inline-block; border:1.5px solid var(--ink);}
.filter-grid{display:flex; flex-wrap:wrap; gap:16px 24px; align-items:end;}
.field{display:flex; flex-direction:column; gap:6px; min-width:126px;}
.field label{font-size:11px; color:var(--muted); letter-spacing:.5px; font-weight:700;}
.field select{border:none; border-bottom:2px solid var(--ink); background:transparent; padding:4px 2px; font-size:13.5px; color:var(--ink); outline:none; min-width:132px; font-family:'Noto Sans TC',sans-serif; font-weight:500;}
.chip-group{display:flex; gap:6px;}
.chip{border:2px solid var(--ink); background:var(--card); padding:5px 14px; border-radius:999px; font-size:12.5px; cursor:pointer; color:var(--ink); user-select:none; font-weight:700;}
.chip.on-簡任{background:var(--tangerine); color:#fff;}
.chip.on-薦任{background:var(--cobalt); color:#fff;}
.chip.on-委任{background:var(--amber); color:var(--ink);}
.reset-btn{margin-left:auto; background:none; border:none; color:var(--cobalt-dk); font-size:12.5px; cursor:pointer; text-decoration:underline; font-weight:700; padding:4px;}

.result-line{display:flex; justify-content:space-between; align-items:center; margin:20px 4px 12px; font-size:12.5px; color:var(--muted); font-weight:500; flex-wrap:wrap; gap:6px;}
.result-line .n{font-family:'IBM Plex Mono',monospace; color:var(--ink); font-weight:700;}

.list{display:flex; flex-direction:column; gap:14px;}
.card{background:var(--card); border:2.5px solid var(--ink); position:relative; border-radius:20px; overflow:hidden;}
.rank-mark{position:absolute; top:14px; left:14px; width:46px; height:46px; display:flex; align-items:center; justify-content:center;
  font-size:21px; font-weight:800; border-radius:50%; border:2.5px solid var(--ink); font-family:'Baloo 2', sans-serif; z-index:1;}
.rank-mark.簡任{background:var(--tangerine); color:#fff;}
.rank-mark.薦任{background:var(--cobalt); color:#fff;}
.rank-mark.委任{background:var(--amber); color:var(--ink);}

.card-head{padding:18px 20px 16px 72px; cursor:pointer; display:flex; justify-content:space-between; gap:16px;}
.card-main{flex:1;}
.card-top-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
.agency{font-weight:800; font-size:16.5px; color:var(--ink); font-family:'Baloo 2', sans-serif;}
.rank-pill{font-size:11px; padding:2px 11px; font-weight:700; border:2px solid var(--ink); border-radius:999px;}
.rank-pill.簡任{background:var(--tangerine); color:#fff;}
.rank-pill.薦任{background:var(--cobalt); color:#fff;}
.rank-pill.委任{background:var(--amber); color:var(--ink);}
.status-pill{font-size:11px; padding:2px 11px; font-weight:700; border:2px dashed var(--muted); color:var(--muted); border-radius:999px;}
.status-pill.open{border-color:var(--cobalt); color:var(--cobalt-dk); background:var(--cobalt-tint); border-style:solid;}
.job-title{font-size:14px; color:var(--ink2); font-weight:700; margin-bottom:6px;}
.job-title .fam{color:var(--muted); font-weight:500;}
.summary{font-size:13px; color:var(--muted); line-height:1.65; margin-bottom:10px; max-width:660px;}
.meta-row{display:flex; gap:20px; flex-wrap:wrap; font-size:12px; color:var(--muted);}
.meta-row b{color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:700;}
.chevron{flex:none; width:28px; height:28px; border:2.5px solid var(--ink); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink); transition:transform .2s; margin-top:2px; font-weight:700;}
.card.expanded .chevron{transform:rotate(180deg); background:var(--tangerine); color:#fff; border-color:var(--tangerine-dk);}

.detail{display:none; border-top:2.5px dashed var(--ink); padding:18px 20px 20px 20px; background:#FFFBF3;}
.card.expanded .detail{display:block;}
.detail-grid{display:flex; gap:22px; flex-wrap:wrap;}
.detail-block{flex:1; min-width:260px;}
.detail-block h4{font-size:12.5px; color:var(--ink); margin:0 0 10px; letter-spacing:.5px; display:flex; align-items:center; gap:6px; font-weight:800; font-family:'Baloo 2', sans-serif;}
.detail-block h4 .sq{width:10px;height:10px; background:var(--cobalt); border-radius:50%; display:inline-block; border:1.5px solid var(--ink);}
.last-similar{font-size:12.5px; line-height:1.9; color:var(--ink2); border-left:3px solid var(--tangerine); padding-left:12px;}
.last-similar .lbl{color:var(--muted); display:inline-block; width:76px; font-weight:700;}

.timeline{list-style:none; margin:0; padding:0; border-left:2px dotted var(--muted); margin-left:5px;}
.timeline li{position:relative; padding:0 0 14px 20px;}
.timeline li::before{content:""; position:absolute; left:-6.5px; top:3px; width:10px; height:10px; border-radius:50%; background:var(--card); border:2.5px solid var(--muted);}
.timeline li.open::before{background:var(--cobalt); border-color:var(--cobalt);}
.timeline .t-date{font-size:12.5px; font-weight:700; color:var(--ink); font-family:'IBM Plex Mono',monospace;}
.timeline .t-meta{font-size:11.5px; color:var(--muted); margin-top:2px;}
.timeline .t-tag{font-size:10px; padding:1px 8px; margin-left:6px; border:1.3px solid var(--muted); color:var(--muted); font-weight:700; border-radius:999px;}
.timeline .t-tag.open{border-color:var(--cobalt); color:var(--cobalt-dk);}

.full-posting-toggle{margin-top:18px; border-top:1.5px dashed #E9DFCC; padding-top:14px;}
.fp-btn{
  background:var(--tangerine); color:#fff; border:2.5px solid var(--ink); border-radius:999px; padding:9px 18px; font-size:12.5px; font-weight:700;
  cursor:pointer; display:inline-flex; align-items:center; gap:8px; box-shadow:3px 3px 0 var(--ink);
  transition:transform .1s, box-shadow .1s;
}
.fp-btn:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink);}
.fp-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
.fp-body{display:none; margin-top:14px; border:2.5px solid var(--ink); border-radius:16px; background:var(--card); padding:18px 20px;}
.card.show-full .fp-body{display:block;}
.fp-row{display:flex; font-size:12.5px; line-height:1.8; border-bottom:1px solid #F0E6D4; padding:7px 0;}
.fp-row:last-child{border-bottom:none;}
.fp-row .k{width:110px; flex:none; color:var(--muted); font-weight:700;}
.fp-row .v{color:var(--ink2); white-space:pre-line;}
.fp-source{margin-top:12px; font-size:11px; color:var(--muted); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;}
.fp-source a{font-weight:700; text-decoration:underline; color:var(--cobalt-dk);}

.comment-board{margin-top:20px; border-top:2.5px dashed var(--ink); padding-top:16px;}
.cb-title{font-weight:800; font-size:13.5px; color:var(--ink); margin-bottom:12px; display:flex; align-items:center; gap:8px; font-family:'Baloo 2', sans-serif; flex-wrap:wrap;}
.cb-title .sq{width:10px;height:10px; background:var(--cherry); border-radius:50%; display:inline-block; border:1.5px solid var(--ink);}
.cb-tabs{display:flex; gap:8px; margin-bottom:14px;}
.cb-tab{padding:7px 16px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink); background:var(--card); border:2px solid var(--ink); border-radius:999px;}
.cb-tab.active{background:var(--cobalt); color:#fff; border-color:var(--cobalt-dk);}
.cb-list{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
.cb-item{border:2px solid #EEE1C9; background:var(--card); padding:12px 14px; border-radius:14px;}
.cb-item .cb-meta{display:flex; align-items:center; gap:10px; margin-bottom:6px; font-size:11.5px; color:var(--muted); flex-wrap:wrap;}
.cb-item .cb-author{font-weight:700; color:var(--ink);}
.cb-item .cb-type-tag{border:1.3px solid var(--cobalt); padding:0 8px; font-size:10px; font-weight:700; color:var(--cobalt-dk); border-radius:999px;}
.cb-item .cb-content{font-size:12.8px; line-height:1.75; color:var(--ink2); white-space:pre-line;}
.cb-empty{font-size:12.5px; color:var(--muted); padding:16px 0; text-align:center; border:2px dashed #EEE1C9; border-radius:14px;}
.cb-form{border:2.5px solid var(--ink); border-radius:16px; padding:14px 16px; background:#FFFBF3;}
.cb-form-row{display:flex; gap:12px; margin-bottom:10px; flex-wrap:wrap; align-items:center;}
.cb-radio{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--ink); cursor:pointer;}
.cb-form textarea{width:100%; border:2px solid var(--ink); border-radius:12px; padding:10px 12px; font-family:'Noto Sans TC',sans-serif; font-size:13px; resize:vertical; min-height:64px; outline:none; background:var(--card);}
.cb-form input[type=text]{border:none; border-bottom:2px solid var(--ink); background:transparent; font-size:12.5px; padding:4px 2px; outline:none; width:160px;}
.cb-submit{margin-top:10px; background:var(--cobalt); color:#fff; border:2.5px solid var(--ink); border-radius:999px; padding:8px 20px; font-size:12.5px; font-weight:700; cursor:pointer; box-shadow:3px 3px 0 var(--ink); transition:transform .1s, box-shadow .1s;}
.cb-submit:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink);}
.cb-submit:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}

.empty{text-align:center; padding:60px 20px; color:var(--muted); font-size:13.5px; border:2.5px dashed var(--ink); background:var(--card); border-radius:20px;}
.empty b{display:block; font-size:17px; color:var(--ink); margin-bottom:8px; font-weight:800; font-family:'Baloo 2', sans-serif;}

footer{margin-top:36px; padding-top:16px; border-top:2.5px dashed var(--ink); font-size:11.5px; color:var(--muted); line-height:1.8;}

@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr);}
  .header-card{flex-direction:column; align-items:flex-start; padding:24px 22px;}
  .header-text h1{font-size:30px;}
  .card-head{flex-direction:column; padding-left:66px;}
}
</style>
</head>
<body>
<div class="stripe-band">
  <svg viewBox="0 0 1200 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path class="wave-flow" d="M-200,30 Q-150,52 -100,30 T0,30 T100,30 T200,30 T300,30 T400,30 T500,30 T600,30 T700,30 T800,30 T900,30 T1000,30 T1100,30 T1200,30 T1300,30 T1400,30 L1400,0 L-200,0 Z" fill="#2B2118"/>
  </svg>
</div>
<div class="wrap">

  <header>
    <div class="header-card">
      <div class="hc-blob b1"></div>
      <div class="hc-blob b2"></div>
      <div class="hc-blob b3"></div>
      <div class="header-text">
        <div class="eyebrow">CIVIL SERVICE JOB ARCHIVE</div>
        <h1 class="round">公職ㄉ人力銀行</h1>
      </div>
    </div>
  </header>

  <div class="highlight-section">
    <div class="highlight-title">
      <span class="dot"></span> 今日新增職缺精選
      <span class="sub">— 這幾筆是今天新上架的，先睹為快</span>
      <span class="hl-legend">
        <span class="lg-item"><span class="lg-sw lg-簡任"></span>簡任</span>
        <span class="lg-item"><span class="lg-sw lg-薦任"></span>薦任</span>
        <span class="lg-item"><span class="lg-sw lg-委任"></span>委任</span>
      </span>
    </div>
    <div class="highlight-row" id="highlight-row"></div>
  </div>

  <div class="quick-search">
    <span class="icon">🔍</span>
    <input id="q" type="text" placeholder="快速搜尋機關、職稱、職系或關鍵字…">
  </div>

  <div class="stats" id="stats"></div>

  <div class="filter-panel">
    <div class="ftitle"><span class="sq"></span>篩選條件</div>
    <div class="filter-grid">
      <div class="field"><label>縣市</label><select id="f-city"><option value="">全部縣市</option></select></div>
      <div class="field"><label>職系</label><select id="f-family"><option value="">全部職系</option></select></div>
      <div class="field"><label>機關</label><select id="f-agency"><option value="">全部機關</option></select></div>
      <div class="field"><label>職等</label>
        <div class="chip-group" id="f-rank">
          <div class="chip" data-rank="簡任">簡任</div>
          <div class="chip" data-rank="薦任">薦任</div>
          <div class="chip" data-rank="委任">委任</div>
        </div>
      </div>
      <div class="field"><label>排序方式</label>
        <select id="f-sort">
          <option value="deadline">到期日：近→遠</option>
          <option value="freq">近五年刊登次數：多→少</option>
          <option value="agency">機關筆劃</option>
        </select>
      </div>
      <button class="reset-btn" id="reset">清除所有條件</button>
    </div>
  </div>

  <div class="result-line">
    <div>目前顯示 <span class="n" id="count">0</span> 筆職缺</div>
    <div>點卡片展開歷史紀錄／完整公告</div>
  </div>

  <div class="list" id="list"></div>

  <footer>
    ▍本頁機關、職缺皆抓取自事求人開放資料每日更新；留言板功能開發中，尚未開放。<br>
    ▍收錄範圍限「簡任、薦任、委任」具公務人員任用資格之職缺，不含約僱、約聘、派用等非公務人員職缺。<br>
    ▍「查看完整職缺公告」區塊參照事求人官方公告頁的欄位格式製作，正式上線時會連結回官方原始公告。
  </footer>
</div>

<script>
<script>
let jobs = [];
let TODAY_STR = "";

/* 把後端 data.json 的欄位名稱，轉成畫面渲染函式需要的格式 */
function adaptJob(r){
  return {
    id: r.id,
    agency: r.agency,
    city: r.city,
    rank: r.rank_track,
    rankDetail: r.rank_detail,
    family: r.family,
    title: r.title,
    viewUrl: r.view_url,
    quota: r.quota,
    gender: r.gender,
    email: r.email,
    summary: r.summary,
    qualification: r.qualification || [],
    jobContentFull: r.job_content_full || [],
    address: r.address,
    contact: r.contact || [],
    start: r.period_start,
    end: r.period_end,
    freq5y: r.freq5y,
    freq3y: r.freq3y,
    highlight: !!r.highlight,
    lastSimilar: r.last_similar ? {
      agency: r.last_similar.agency,
      date: r.last_similar.period_start,
      period: `${r.last_similar.period_start} ～ ${r.last_similar.period_end}`,
      content: r.last_similar.summary
    } : null,
    history: (r.history || []).map(h => ({
      period: `${h.period_start} ～ ${h.period_end}`,
      days: h.days,
      note: `${h.agency}｜${h.title || ''}`
    })),
  };
}

function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000)+1; }
function isOpen(job){ return TODAY_STR ? job.end >= TODAY_STR : true; }

function renderHighlights(){
  let picks = jobs.filter(j=>j.highlight);
  if(picks.length < 5){
    const rest = jobs.filter(j=>!j.highlight).sort((a,b)=> b.start.localeCompare(a.start));
    picks = picks.concat(rest).slice(0,5);
  } else {
    picks = picks.slice(0,5);
  }
  document.getElementById('highlight-row').innerHTML = picks.map(j=>`
    <div class="hl-card rank-${j.rank}" onclick="jumpTo('${j.id}')">
      <div>
        <div class="hl-badge">${j.rank}</div>
        <div class="hl-agency">${j.agency}</div>
      </div>
      <div class="hl-meta">${j.family}．${(j.rankDetail||'').replace('至',' – ')}<br>${j.city}</div>
    </div>
  `).join('');
}
function jumpTo(id){
  state.expanded.add(id);
  render();
  setTimeout(()=>{
    const el = document.querySelector(`.card[data-id="${id}"]`);
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 30);
}
window.jumpTo = jumpTo;

let cities=[], families=[], agencies=[];
const citySel=document.getElementById('f-city');
const famSel=document.getElementById('f-family');
const agencySel=document.getElementById('f-agency');

function populateFilters(){
  cities=[...new Set(jobs.map(j=>j.city).filter(Boolean))].sort();
  families=[...new Set(jobs.map(j=>j.family).filter(Boolean))].sort();
  agencies=[...new Set(jobs.map(j=>j.agency).filter(Boolean))].sort();
  cities.forEach(c=>citySel.insertAdjacentHTML('beforeend',`<option value="${c}">${c}</option>`));
  families.forEach(f=>famSel.insertAdjacentHTML('beforeend',`<option value="${f}">${f}</option>`));
  agencies.forEach(a=>agencySel.insertAdjacentHTML('beforeend',`<option value="${a}">${a}</option>`));
}

function renderStats(stats){
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${stats.open_count}</div><div class="lbl">目前刊登中</div></div>
    <div class="stat"><div class="num">${stats.total_archived}</div><div class="lbl">累計歸檔筆數</div></div>
    <div class="stat"><div class="num">${stats.agency_count}</div><div class="lbl">涵蓋機關數</div></div>
    <div class="stat"><div class="num mono" style="font-size:15px;">${stats.generated_at}</div><div class="lbl">最後更新日期</div></div>
  `;
}

const state = { q:"", city:"", family:"", agency:"", ranks:new Set(), sort:"deadline", showFull:new Set(), expanded:new Set() };

document.getElementById('q').addEventListener('input', e=>{state.q=e.target.value.trim(); render();});
citySel.addEventListener('change', e=>{state.city=e.target.value; render();});
famSel.addEventListener('change', e=>{state.family=e.target.value; render();});
agencySel.addEventListener('change', e=>{state.agency=e.target.value; render();});
document.getElementById('f-sort').addEventListener('change', e=>{state.sort=e.target.value; render();});
document.querySelectorAll('#f-rank .chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    const r=chip.dataset.rank;
    if(state.ranks.has(r)){state.ranks.delete(r); chip.classList.remove('on-'+r);}
    else{state.ranks.add(r); chip.classList.add('on-'+r);}
    render();
  });
});
document.getElementById('reset').addEventListener('click', ()=>{
  state.q=""; state.city=""; state.family=""; state.agency=""; state.ranks.clear(); state.sort="deadline";
  document.getElementById('q').value=""; citySel.value=""; famSel.value=""; agencySel.value=""; document.getElementById('f-sort').value="deadline";
  document.querySelectorAll('#f-rank .chip').forEach(c=>c.classList.remove('on-簡任','on-薦任','on-委任'));
  render();
});

function filterJobs(){
  return jobs.filter(j=>{
    if(state.city && j.city!==state.city) return false;
    if(state.family && j.family!==state.family) return false;
    if(state.agency && j.agency!==state.agency) return false;
    if(state.ranks.size>0 && !state.ranks.has(j.rank)) return false;
    if(state.q){
      const hay=(j.agency+j.title+j.summary+j.family).toLowerCase();
      if(!hay.includes(state.q.toLowerCase())) return false;
    }
    return true;
  }).sort((a,b)=>{
    const openDiff = (isOpen(b)?1:0) - (isOpen(a)?1:0);
    if(openDiff !== 0) return openDiff;
    if(state.sort==="deadline") return a.end.localeCompare(b.end);
    if(state.sort==="freq") return b.freq5y-a.freq5y;
    if(state.sort==="agency") return a.agency.localeCompare(b.agency,'zh-Hant');
    return 0;
  });
}

function fullPostingBody(j){
  return `
    <div class="fp-row"><div class="k">徵才機關</div><div class="v">${j.agency}</div></div>
    <div class="fp-row"><div class="k">人員區分</div><div class="v">公務人員(考試分發任用)</div></div>
    <div class="fp-row"><div class="k">官職等</div><div class="v">${j.rankDetail||''}</div></div>
    <div class="fp-row"><div class="k">職系</div><div class="v">${j.family}</div></div>
    <div class="fp-row"><div class="k">名額</div><div class="v">${j.quota||'—'}</div></div>
    <div class="fp-row"><div class="k">性別</div><div class="v">${j.gender||'不限'}</div></div>
    <div class="fp-row"><div class="k">工作地點</div><div class="v">${j.city}</div></div>
    <div class="fp-row"><div class="k">有效期間</div><div class="v">${j.start} ～ ${j.end}</div></div>
    <div class="fp-row"><div class="k">資格條件</div><div class="v">${(j.qualification.length?j.qualification:['（尚無資料）']).map((t,i)=>`${i+1}. ${t}`).join('\\n')}</div></div>
    <div class="fp-row"><div class="k">工作項目</div><div class="v">${(j.jobContentFull.length?j.jobContentFull:[j.summary||'（尚無資料）']).map((t,i)=>`${i+1}. ${t}`).join('\\n')}</div></div>
    <div class="fp-row"><div class="k">工作地址</div><div class="v">${j.address||'—'}</div></div>
    <div class="fp-row"><div class="k">聯絡E-Mail</div><div class="v">${j.email||'—'}</div></div>
    <div class="fp-row"><div class="k">聯絡方式</div><div class="v">${(j.contact.length?j.contact:['請至事求人系統線上應徵。']).map((t,i)=>`${i+1}. ${t}`).join('\\n')}</div></div>
    <div class="fp-source">
      <span>內容格式參照事求人官方公告頁面整理</span>
      <a href="${j.viewUrl || 'https://web3.dgpa.gov.tw/want03front/AP/WANTF00001.ASPX'}" target="_blank" rel="noopener">前往事求人官網查看原公告 ↗</a>
    </div>
  `;
}

function card(j){
  const open=isOpen(j);
  const days=daysBetween(j.start,j.end);
  const exp=state.expanded.has(j.id);
  const showFull=state.showFull.has(j.id);
  return `
  <div class="card ${exp?'expanded':''} ${showFull?'show-full':''}" data-id="${j.id}">
    <div class="rank-mark ${j.rank}">${(j.rank||'?')[0]}</div>
    <div class="card-head" onclick="toggleCard('${j.id}')">
      <div class="card-main">
        <div class="card-top-row">
          <span class="agency">${j.agency}</span>
          <span class="rank-pill ${j.rank}">${j.rank}</span>
          <span class="status-pill ${open?'open':''}">${open?'受理中':'已截止'}</span>
        </div>
        <div class="job-title">${j.title||'（未標明職稱）'} <span class="fam">｜${j.family}｜${j.city}｜${j.rankDetail||''}</span></div>
        <div class="summary">${j.summary || '（無職務內容摘要）'}</div>
        <div class="meta-row">
          <span>刊登期間：<b>${j.start} ～ ${j.end}</b>（共 <b>${days}</b> 天）</span>
          <span>近五年相關刊登：<b>${j.freq5y}</b> 次</span>
        </div>
      </div>
      <div class="chevron">▾</div>
    </div>
    <div class="detail">
      <div class="detail-grid">
        <div class="detail-block">
          <h4><span class="sq"></span>上一次相似職缺</h4>
          <div class="last-similar">
            ${j.lastSimilar ? `
              <div><span class="lbl">刊登機關</span>${j.lastSimilar.agency}</div>
              <div><span class="lbl">刊登日期</span><span class="mono">${j.lastSimilar.date}</span></div>
              <div><span class="lbl">刊登期間</span>${j.lastSimilar.period}</div>
              <div><span class="lbl">職務內容</span>${j.lastSimilar.content||'（無摘要）'}</div>
            ` : `<div style="color:var(--muted)">近期查無同機關同職系的歷史刊登紀錄。</div>`}
            <div style="margin-top:8px; color:var(--muted);"><span class="lbl">近三年次數</span><b class="mono" style="color:var(--tangerine-dk);">${j.freq3y} 次</b>類似職缺刊登紀錄</div>
          </div>
        </div>
        <div class="detail-block">
          <h4><span class="sq"></span>歷史刊登紀錄（可回溯）</h4>
          <ul class="timeline">
            ${open?`<li class="open"><div class="t-date mono">${j.start} ～ ${j.end}</div><div class="t-meta">本次刊登<span class="t-tag open">受理中</span></div></li>`:''}
            ${j.history.length ? j.history.map(h=>`
              <li>
                <div class="t-date mono">${h.period}</div>
                <div class="t-meta">${h.note}（${h.days} 天）<span class="t-tag">已截止</span></div>
              </li>`).join('') : '<li><div class="t-meta">查無更早的歷史紀錄</div></li>'}
          </ul>
        </div>
      </div>

      <div class="full-posting-toggle">
        <button class="fp-btn" onclick="event.stopPropagation(); toggleFull('${j.id}')">${showFull? '收合完整職缺公告 ▴' : '查看完整職缺公告 ▾'}</button>
        <div class="fp-body">${fullPostingBody(j)}</div>
      </div>
    </div>
  </div>`;
}

function render(){
  const filtered = filterJobs();
  document.getElementById('count').textContent = filtered.length;
  const list = document.getElementById('list');
  if(filtered.length===0){
    list.innerHTML = `<div class="empty"><b>查無符合條件的職缺</b>目前的篩選組合沒有對應紀錄，試著放寬縣市、職等或職系條件，或清除關鍵字後再查一次。</div>`;
    return;
  }
  list.innerHTML = filtered.map(card).join('');
}

function toggleCard(id){
  if(state.expanded.has(id)) state.expanded.delete(id);
  else state.expanded.add(id);
  render();
}
window.toggleCard = toggleCard;

function toggleFull(id){
  if(state.showFull.has(id)) state.showFull.delete(id);
  else state.showFull.add(id);
  render();
  setTimeout(()=>{
    const el = document.querySelector(`.card[data-id="${id}"]`);
    if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 20);
}
window.toggleFull = toggleFull;

fetch('./data.json?_=' + Date.now())
  .then(r=>r.json())
  .then(data=>{
    jobs = (data.jobs || []).map(adaptJob);
    TODAY_STR = (data.stats && data.stats.generated_at) || "";
    renderStats(data.stats || {open_count:0,total_archived:0,agency_count:0,generated_at:'尚未執行'});
    populateFilters();
    renderHighlights();
    if(jobs.length===0){
      document.getElementById('list').innerHTML = `<div class="empty"><b>目前還沒有資料</b>每日排程還沒有成功執行過一次。請先依 README 完成部署，並在 GitHub Actions 頁面手動觸發一次 workflow。</div>`;
      document.getElementById('count').textContent = '0';
    } else {
      render();
    }
  })
  .catch(err=>{
    document.getElementById('list').innerHTML = `<div class="empty"><b>還沒有資料</b>data.json 尚未產生，代表每日排程還沒有成功執行過一次。請先依 README 完成部署，並在 GitHub Actions 頁面手動觸發一次 workflow。</div>`;
    document.getElementById('stats').innerHTML = '';
    document.getElementById('count').textContent = '0';
  });
</script>
</body>
</html>
